<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">
<link rel="stylesheet" href="/theme.css">
<title>urYZY [HOME]</title>

<style>
/* ---- page-specific styles only; everything shared lives in theme.css ---- */

html, body {
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body {
  background:#efefef;
}

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0;
}

.hero-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:100vh;
  padding-top:46px;
}

.logo-wrap{
  position:relative;
  width:min(58vw, 620px);
  height:min(58vw, 620px);
  max-width:620px;
  max-height:620px;
  display:grid;
  place-items:center;
  margin:0 auto 0;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 28%, rgba(255,255,255,.9) 0%, rgba(255,255,255,.7) 14%, rgba(209,209,209,.9) 35%, rgba(160,160,160,.8) 62%, rgba(90,90,90,.28) 100%);
  box-shadow:
    inset -18px -18px 22px rgba(0,0,0,.06),
    inset 16px 16px 22px rgba(255,255,255,.6),
    0 0 0 1px rgba(0,0,0,.03);
}

.logo-wrap:before{
  content:"";
  position:absolute;
  inset:8%;
  border-radius:50%;
  background:
    radial-gradient(circle at 48% 30%, rgba(255,255,255,.9) 0%, rgba(255,255,255,.2) 30%, rgba(0,0,0,.08) 100%);
  opacity:.8;
}

.logo-wrap:after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 25%, rgba(255,255,255,.7) 0%, rgba(255,255,255,.18) 16%, rgba(0,0,0,.06) 100%),
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(0,0,0,.04) 55%, rgba(180,180,180,.12));
  mix-blend-mode:screen;
  opacity:.8;
}

.logo{
  position:relative;
  z-index:2;
  width:78%;
  height:78%;
  object-fit:contain;
  filter:
    drop-shadow(0 18px 28px rgba(0,0,0,.12))
    grayscale(1) brightness(1.15);
  opacity:.95;
  animation:hero-float 6s ease-in-out infinite;
}

@keyframes hero-float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

.globe-mark{
  position:relative;
  width:24px;
  height:24px;
  margin-top:18px;
  border-radius:4px;
  background:#111;
  transform:rotate(45deg);
  box-shadow:0 0 0 1px rgba(0,0,0,.12);
}

.globe-mark:before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:0;
  height:0;
  transform:translate(-50%,-50%) rotate(45deg);
  border-left:5px solid transparent;
  border-right:5px solid transparent;
  border-top:8px solid #efefef;
}

h1,
.subtitle,
.actions,
.stats,
.recent{
  display:none !important;
}

/* subtle stat strip beneath the fold — new, but same visual language */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
  margin-top:64px;
  padding-top:34px;
  border-top:1px solid var(--line);
}

.stat{
  text-align:center;
}

.stat-value{
  font-size:26px;
  font-weight:700;
  letter-spacing:-1px;
}

.stat-label{
  margin-top:6px;
  color:var(--dim);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

/* recently added strip */
.recent{
  margin-top:56px;
}

.recent-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:14px;
}

.recent-title{
  font-size:13px;
  font-weight:700;
  letter-spacing:-.2px;
}

.recent-link{
  color:var(--dim);
  text-decoration:none;
  font-size:10px;
  font-weight:700;
  transition:color var(--dur-fast) ease;
}

.recent-link:hover{
  color:var(--text);
}

.recent-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.recent-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  text-decoration:none;
  color:inherit;
}

.recent-icon{
  flex:0 0 auto;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.07);
  border-radius:9px;
  background:#181a1f;
  color:#707680;
  font-size:8px;
  font-weight:700;
  letter-spacing:.5px;
  overflow:hidden;
}

.recent-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.recent-info{
  min-width:0;
}

.recent-name{
  font-size:11.5px;
  font-weight:700;
  letter-spacing:-.1px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.recent-tag{
  margin-top:3px;
  color:var(--dim);
  font-size:9px;
}

/* homepage update modal */
.welcome-modal{
  position:fixed;
  inset:0;
  z-index:600;
  display:grid;
  place-items:center;
  padding:24px;
  background:rgba(0,0,0,.78);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity var(--dur-base) ease,visibility var(--dur-base) ease;
}

.welcome-modal.is-visible{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.welcome-card{
  position:relative;
  width:min(560px,100%);
  padding:26px 28px 23px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:12px;
  background:#14161a;
  box-shadow:0 18px 45px rgba(0,0,0,.45);
  transform:translateY(12px) scale(.97);
  transition:transform var(--dur-slow) var(--ease-spring);
}

.welcome-card:before{
  content:"";
  position:absolute;
  top:0;
  left:30px;
  right:30px;
  height:2px;
  border-radius:0 0 4px 4px;
  background:#fff;
  box-shadow:0 0 22px rgba(255,255,255,.24);
}

.welcome-modal.is-visible .welcome-card{
  transform:translateY(0) scale(1);
}

.welcome-kicker{
  color:#aeb2b9;
  font-size:9px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}

.welcome-top{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  padding-right:42px;
}

.welcome-badge{
  display:inline-flex;
  align-items:center;
  height:23px;
  padding:0 9px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  color:#090a0c;
  background:#fff;
  font-size:8px;
  font-weight:700;
  letter-spacing:1.2px;
}

.welcome-title{
  margin:16px 42px 0 0;
  color:#fff;
  font-size:clamp(28px,5vw,36px);
  line-height:.95;
  letter-spacing:-1.2px;
}

.welcome-copy{
  margin:22px 0 0;
  color:#f0f0f1;
  font-size:14px;
  font-weight:700;
}

.welcome-copy.secondary{
  margin-top:7px;
  color:#9da2ac;
  font-size:12px;
  font-weight:400;
  line-height:1.6;
}

.welcome-divider{
  height:1px;
  margin-top:22px;
  background:rgba(255,255,255,.1);
}

.welcome-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-top:17px;
}

.welcome-meta{
  color:#666c76;
  font-size:9px;
  font-weight:700;
  letter-spacing:1.1px;
  text-transform:uppercase;
}

.welcome-continue{
  height:34px;
  padding:0 14px;
  border:1px solid #fff;
  border-radius:7px;
  background:#fff;
  color:#080808;
  font-family:Arial,Helvetica,sans-serif;
  font-size:10px;
  font-weight:700;
  cursor:pointer;
  transition:background var(--dur-fast) ease,transform var(--dur-fast) ease;
}

.welcome-continue:hover{
  background:#dcdde0;
  transform:translateY(-1px);
}

.welcome-continue:focus-visible{
  outline:2px solid rgba(255,255,255,.7);
  outline-offset:3px;
}

.welcome-close{
  position:absolute;
  top:17px;
  right:17px;
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  background:rgba(255,255,255,.045);
  color:#c9cbd0;
  font-family:Arial,Helvetica,sans-serif;
  font-size:19px;
  line-height:1;
  cursor:pointer;
  transition:background var(--dur-fast) ease,border-color var(--dur-fast) ease,color var(--dur-fast) ease,transform var(--dur-fast) ease;
}

.welcome-close:hover{
  border-color:rgba(255,255,255,.28);
  background:#fff;
  color:#080808;
  transform:rotate(90deg);
}

.welcome-close:focus-visible{
  outline:2px solid rgba(255,255,255,.7);
  outline-offset:3px;
}

@media(prefers-reduced-motion:reduce){
  .welcome-modal,.welcome-card,.welcome-close{
    transition:none;
  }
}

@media(max-width:760px){
  .recent-grid{
    grid-template-columns:1fr;
  }
}

@media(prefers-reduced-motion:reduce){
  .logo{animation:none}
}

@media(max-width:560px){
  .hero{
    min-height:auto;
    padding:20px 0 8px;
  }

  .logo-wrap{
    width:132px;
    height:132px;
    margin-bottom:27px;
  }

  h1{
    font-size:clamp(58px,19vw,86px);
    letter-spacing:-5px;
  }

  .subtitle{
    max-width:330px;
    font-size:12px;
  }

  .actions{
    width:100%;
    flex-direction:column;
    gap:8px;
  }

  .actions .btn{
    width:100%;
  }

  .stats{
    margin-top:45px;
    padding-top:25px;
  }

  .recent-grid{
    grid-template-columns:1fr;
  }
}

@media(min-width:761px){
  .hero{
    min-height:auto;
    padding:92px 0 70px;
    text-align:left;
  }

  .hero-inner{
    width:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(240px,340px);
    grid-template-rows:auto auto auto;
    column-gap:clamp(36px,8vw,112px);
    align-items:center;
  }

  .logo-wrap{
    grid-column:2;
    grid-row:1 / span 3;
    justify-self:center;
    width:240px;
    height:240px;
    margin:0;
  }

  .hero h1,
  .hero .subtitle,
  .hero .actions{
    grid-column:1;
  }

  .hero h1{
    font-size:clamp(76px,9vw,116px);
  }

  .hero .subtitle{
    margin:22px 0 0;
  }

  .hero .actions{
    margin-top:26px;
  }
}

@media(max-width:760px){
  .hero{
    min-height:auto;
    padding-top:75px;
  }

  .logo-wrap{
    margin-bottom:24px;
  }
}
</style>

<style>
body{background:#efefef;}
.hero{min-height:680px;padding:110px 0 72px;text-align:left;align-items:center;}
.hero-inner{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);grid-template-rows:auto auto auto;column-gap:clamp(40px,8vw,120px);align-items:center;max-width:1180px;min-height:0;padding:0;}
.hero::before{display:none;}
.logo-wrap{grid-column:2;grid-row:1 / span 3;width:min(34vw,410px);height:min(34vw,410px);margin:0;justify-self:center;background:#111;box-shadow:0 28px 70px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.12);overflow:hidden;}
.logo-wrap::before{inset:7%;border:1px solid rgba(255,255,255,.16);background:repeating-radial-gradient(circle,transparent 0 16px,rgba(255,255,255,.05) 17px 18px);opacity:.8;}
.logo-wrap::after{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 28%),linear-gradient(135deg,transparent 48%,rgba(255,255,255,.1));mix-blend-mode:screen;}
.logo{width:70%;height:70%;filter:none;opacity:1;}
.hero h1{display:block!important;grid-column:1;grid-row:1;margin:0;color:#111!important;font-size:clamp(82px,13vw,176px);line-height:.78;letter-spacing:-.09em;text-shadow:none!important;}
.hero .subtitle{display:block!important;grid-column:1;grid-row:2;max-width:480px;margin:28px 0 0;color:#4f4f4f;font-size:13px;font-weight:700;line-height:1;letter-spacing:.24em;text-transform:uppercase;}
.hero .actions{display:flex!important;grid-column:1;grid-row:3;align-items:center;gap:10px;margin-top:30px;}
.hero .actions .btn{height:43px;border:1px solid #111;background:#111;color:#fff;letter-spacing:.16em;transition:transform .2s ease,background .2s ease;}
.hero .actions .btn:not(.primary){background:transparent;color:#111;border-color:rgba(17,17,17,.22);}
.hero .actions .btn:hover{transform:translateY(-2px);background:#2b2b2b;color:#fff;}
.hero .actions .btn:not(.primary):hover{background:#111;color:#fff;}
.stats{display:grid!important;grid-template-columns:repeat(3,1fr);gap:0;margin:0;padding:25px 0 0;border-top:1px solid rgba(0,0,0,.16);}
.stat{text-align:left;padding-right:18px;border-right:1px solid rgba(0,0,0,.12);}
.stat:not(:first-child){padding-left:18px;}
.stat:last-child{border-right:0;}
.stat-value{color:#111!important;font-size:32px;text-shadow:none!important;}
.stat-label{color:#777;}
.recent{display:block!important;margin-top:58px;}
.recent-head{border-bottom:1px solid rgba(0,0,0,.16);padding-bottom:12px;}
.recent-title{color:#111;font-size:14px;}
.recent-link{color:#666;}
.recent-grid{grid-template-columns:repeat(3,1fr);gap:12px;}
.recent-item{background:rgba(255,255,255,.58);border:1px solid rgba(0,0,0,.08);transition:transform .2s ease,background .2s ease;}
.recent-item:hover{transform:translateY(-3px);background:#fff;}
.recent-icon{background:#111;border:0;border-radius:0;}
.recent-name{color:#111;}
.recent-tag{color:#777;}
.welcome-modal{display:none!important;}
@media(max-width:760px){.hero{min-height:0;padding:105px 0 54px;}.hero-inner{display:flex;flex-direction:column;align-items:stretch;gap:0;}.logo-wrap{order:1;width:min(72vw,330px);height:min(72vw,330px);align-self:center;margin:0 0 44px;}.hero h1{order:2;font-size:clamp(76px,22vw,132px);}.hero .subtitle{order:3;margin-top:20px;font-size:11px;letter-spacing:.2em;}.hero .actions{order:4;flex-wrap:wrap;margin-top:24px;}.stats{margin-top:0;}.recent-grid{grid-template-columns:1fr;}.recent-item{padding:11px;}}
</style>
</head>

<body data-page="home">

<nav class="nav">
  <div class="nav-slider"></div>
  <a href="/" class="active" data-page="home">Home</a>
  <a href="/downloads" data-page="downloads">Downloads</a>
  <a href="/updates" data-page="updates">Updates</a>
  <a href="/gallery.html" data-page="gallery">Gallery</a>
</nav>

<main class="container u-view">

  <section class="hero">
    <div class="hero-inner u-stagger">

      <div class="logo-wrap" aria-label="urYZY archive">
        <img class="logo" src="/assets/LOGO2.png" alt="urYZY" width="170" height="170">
      </div>

      <h1>urYZY</h1>

      <p class="subtitle">
        UNRELEASED.
      </p>

      <div class="actions" style="display:none;">
        <a class="btn primary" href="/downloads" data-page="downloads">
          Explore the archive
        </a>
        <a class="btn" href="/updates" data-page="updates">
          See what changed
        </a>
      </div>

    </div>
  </section>

  <section class="stats u-stagger" id="statsStrip">
    <div class="stat">
      <div class="stat-value" id="statFiles">—</div>
      <div class="stat-label">Files Archived</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statProjects">—</div>
      <div class="stat-label" id="statProjectsLabel">Projects</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statUpdates">—</div>
      <div class="stat-label">Recent Updates</div>
    </div>
  </section>

  <section class="recent u-stagger">
    <div class="recent-head">
      <div class="recent-title">Latest additions</div>
      <a class="recent-link" href="/downloads" data-page="downloads">Open archive <span aria-hidden="true">↗</span></a>
    </div>
    <div class="recent-grid" id="recentGrid"></div>
  </section>

</main>

<footer class="site-footer" id="siteFooter"></footer>

<div class="welcome-modal" id="welcomeModal" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" aria-describedby="welcomeDescription">
  <div class="welcome-card">
    <button class="welcome-close" id="welcomeClose" type="button" aria-label="Close update">&times;</button>
    <div class="welcome-top"><div class="welcome-badge">URGNT</div></div>
    <h2 class="welcome-title" id="welcomeTitle">🥳 NEW WEBSITE LINK</h2>
    <p class="welcome-copy" id="welcomeDescription">What happened?</p>
    <p class="welcome-copy secondary">I got a warning and a violation, but we're back up!</p>
    <div class="welcome-divider"></div>
    <div class="welcome-footer">
      <button class="welcome-continue" id="welcomeContinue" type="button">Continue</button>
    </div>
  </div>
</div>

<div class="route-veil" id="routeVeil">
  <div class="route-veil-ring"></div>
  <img class="route-veil-logo" id="routeVeilLogo" src="/assets/logo.png" alt="">
  <div class="route-veil-bar"><div class="route-veil-bar-fill"></div></div>
</div>

<script>
(function(){
"use strict";

var SHOW_WELCOME_CARD=false;
var welcomeModal=document.getElementById("welcomeModal");
var welcomeClose=document.getElementById("welcomeClose");
var welcomeContinue=document.getElementById("welcomeContinue");

function closeWelcome(){
  if(!welcomeModal)return;
  welcomeModal.classList.remove("is-visible");
  window.setTimeout(function(){welcomeModal.setAttribute("aria-hidden","true");},300);
}

if(welcomeModal&&SHOW_WELCOME_CARD){
  welcomeModal.setAttribute("aria-hidden","false");
  window.requestAnimationFrame(function(){welcomeModal.classList.add("is-visible");});
  welcomeClose.addEventListener("click",closeWelcome);
  welcomeContinue.addEventListener("click",closeWelcome);
  welcomeModal.addEventListener("click",function(event){
    if(event.target===welcomeModal)closeWelcome();
  });
  document.addEventListener("keydown",function(event){
    if(event.key==="Escape")closeWelcome();
  });
}else if(welcomeModal){
  welcomeModal.remove();
}

// same dataset shape as /downloads — kept minimal here since this page
// only needs it for the stat strip + recently-added preview.
var files=[
  {name:"BULLY [EARLY]",icon:"BULLYEARLY.png",project:"BULLY"},
  {name:"BULLY [FIRST]",icon:"BULLY1.png",project:"BULLY"},
  {name:"BULLY [SECOND]",icon:"BULLY2.png",project:"BULLY"},
  {name:"BULLY [THIRD]",icon:"BULLY3.png",project:"BULLY"},
  {name:"BULLY [IRKO]",icon:"NO_CIERTO_BESAME_MAMA.png",project:"BULLY"},
  {name:"BULLY [DIGITAL FIRST]",icon:"BULLYDG.png",project:"BULLY"},
  {name:"BULLY [LISTENING PARTY]",icon:"BULLYLP.png",project:"BULLY"},
  {name:"BULLY [PHYSICAL VERSION]",icon:"BULLYPV.png",project:"BULLY"},
  {name:"CUCK",icon:"CUCK.png",project:"WW3"},
  {name:"IN A PERFECT WORLD",icon:"IAPW.png",project:"WW3"},
  {name:"IN A PERFECT WORLD [EARLY]",icon:"IAPWE.png",project:"WW3"},
  {name:"WW3",icon:"WW3.png",project:"WW3"},
  {name:"WAR",icon:"WAR.jpg",project:"WAR"},
  {name:"BAD BITCH PLAYBOOK [PRE VULTURES 1]",icon:"BADBITCHPLAYBOOKPREVULTURES1.png",project:"BAD BITCH PLAYBOOK"},
  {name:"BAD BITCH PLAYBOOK",icon:"BADBITCHPLAYBOOK.png",project:"BAD BITCH PLAYBOOK"},
  {name:"BAD BITCH PLAYBOOK VOL. 2",icon:"BADBITCHPLAYBOOK2.png",project:"BAD BITCH PLAYBOOK"}
];

function escapeHTML(value){
  return String(value==null?"":value).replace(/[&<>"']/g,function(ch){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[ch];
  });
}

var projectCount=new Set(files.map(function(f){return f.project;})).size;

document.getElementById("statFiles").textContent=files.length;
document.getElementById("statProjects").textContent=projectCount;
document.getElementById("statProjectsLabel").textContent=
  projectCount===1?"Project":"Projects";
document.getElementById("statUpdates").textContent=3;

var recent=files.slice(-3).reverse();

document.getElementById("recentGrid").innerHTML=recent.map(function(file){
  return ''+
    '<a class="recent-item surface-card" href="/downloads" data-page="downloads">'+
      '<div class="recent-icon">'+
        '<img src="/assets/'+escapeHTML(file.icon)+'" alt="" '+
          'onerror="this.style.display=\'none\';this.parentElement.textContent=\'ZIP\'">'+
      '</div>'+
      '<div class="recent-info">'+
        '<div class="recent-name">'+escapeHTML(file.name)+'</div>'+
        '<div class="recent-tag">'+escapeHTML(file.project)+'</div>'+
      '</div>'+
    '</a>';
}).join("");
})();
</script>
<script src="/theme.js"></script>
<script src="/footer.js"></script>
<script src="/transitions.js"></script>
</body>
</html>
