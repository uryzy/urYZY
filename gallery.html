<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">
<link rel="stylesheet" href="/theme.css">
<script defer src="/_vercel/insights/script.js"></script>
<title>urYZY [GALLERY]</title>
<style>
.gallery-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:28px;
  padding-bottom:27px;
  border-bottom:1px solid var(--line);
}
.gallery-title{
  margin:0;
  color:#f4f5e9;
  font-size:clamp(50px,7vw,82px);
  line-height:.82;
  letter-spacing:-4px;
}
.gallery-copy{
  max-width:430px;
  margin-top:15px;
  color:var(--muted);
  font-size:12px;
  line-height:1.65;
}
.gallery-mark{
  width:118px;
  height:118px;
  object-fit:contain;
  filter:grayscale(1) contrast(1.15) drop-shadow(0 18px 32px rgba(0,0,0,.6));
}
.gallery-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin:23px 0 18px;
}
.gallery-count{
  color:var(--dim);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.1px;
  text-transform:uppercase;
}
.gallery-filters{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.gallery-filter{
  height:34px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.035);
  color:var(--muted);
  font:700 10px Yeezy,Arial,sans-serif;
  cursor:pointer;
}
.gallery-filter.active,
.gallery-filter:hover{
  border-color:#fff;
  background:#fff;
  color:#080808;
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}
.gallery-item{
  position:relative;
  overflow:hidden;
  min-width:0;
  padding:10px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.012)),rgba(15,15,15,.82);
  cursor:pointer;
  transition:transform .3s var(--ease-spring),border-color .2s ease,background .3s ease,box-shadow .3s ease;
}
.gallery-item:hover,
.gallery-item:focus-visible{
  transform:translateY(-5px);
  border-color:rgba(255,255,255,.44);
  background:rgba(25,25,25,.94);
  box-shadow:0 22px 44px rgba(0,0,0,.42);
  outline:none;
}
.gallery-art{
  display:block;
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:16px;
  background:#050505;
  filter:saturate(.92);
  transition:filter .3s ease,transform .45s var(--ease-spring);
}
.gallery-item:hover .gallery-art,
.gallery-item:focus-visible .gallery-art{
  filter:saturate(1.14) contrast(1.04);
  transform:scale(1.025);
}
.gallery-meta{
  display:flex;
  align-items:start;
  justify-content:space-between;
  gap:8px;
  padding:13px 3px 4px;
}
.gallery-name{
  overflow:hidden;
  color:#f0eee8;
  font-size:12px;
  font-weight:700;
  line-height:1.15;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.gallery-kind{
  flex:0 0 auto;
  color:var(--dim);
  font-size:9px;
  font-weight:700;
  letter-spacing:.8px;
  text-transform:uppercase;
}
.gallery-empty{
  grid-column:1/-1;
  padding:50px 20px;
  border:1px dashed var(--line-strong);
  border-radius:18px;
  color:var(--muted);
  text-align:center;
}
@media(max-width:1000px){
  .gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:700px){
  .gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
  .gallery-item{padding:8px;border-radius:18px;}
  .gallery-art{border-radius:13px;}
}
@media(max-width:560px){
  .gallery-head{display:block;}
  .gallery-title{font-size:52px;letter-spacing:-3px;}
  .gallery-mark{display:block;width:86px;height:86px;margin:23px auto 0;}
  .gallery-toolbar{display:block;margin-top:20px;}
  .gallery-filters{margin-top:13px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px;}
  .gallery-filter{flex:0 0 auto;}
  .gallery-name{font-size:11px;}
  .gallery-kind{font-size:8px;}
}
</style>
</head>
<body data-page="gallery">
<nav class="nav">
  <div class="nav-slider"></div>
  <a href="/" data-page="home">Home</a>
  <a href="/downloads" data-page="downloads">Downloads</a>
  <a href="/updates" data-page="updates">Updates</a>
  <a href="/gallery.html" class="active" data-page="gallery">Gallery</a>
</nav>
<main class="container u-view">
  <header class="gallery-head">
    <div>
      <div class="kicker">Visual archive</div>
      <h1 class="gallery-title">Gallery</h1>
      <p class="gallery-copy">A visual index of the projects, versions, and worlds collected in the archive.</p>
    </div>
    <img class="gallery-mark" src="/assets/LOGO2.png" alt="urYZY">
  </header>
  <div class="gallery-toolbar">
    <div class="gallery-count" id="galleryCount"></div>
    <div class="gallery-filters" id="galleryFilters"></div>
  </div>
  <section class="gallery-grid" id="galleryGrid" aria-label="Album artwork gallery"></section>
</main>
<footer class="site-footer" id="siteFooter"></footer>
<script>
(function(){
  "use strict";
  var items=[
    {name:"BULLY [EARLY]",project:"BULLY",art:"BULLYEARLY.png"},
    {name:"BULLY [FIRST]",project:"BULLY",art:"BULLY1.png"},
    {name:"BULLY [SECOND]",project:"BULLY",art:"BULLY2.png"},
    {name:"BULLY [THIRD]",project:"BULLY",art:"BULLY3.png"},
    {name:"BULLY [IRKO]",project:"BULLY",art:"NO_CIERTO_BESAME_MAMA.png"},
    {name:"BULLY [DIGITAL FIRST]",project:"BULLY",art:"BULLYDG.png"},
    {name:"BULLY [LISTENING PARTY]",project:"BULLY",art:"BULLYLP.png"},
    {name:"BULLY [PHYSICAL VERSION]",project:"BULLY",art:"BULLYPV.png"},
    {name:"WW3",project:"WW3",art:"WW3.png"},
    {name:"CUCK",project:"WW3",art:"CUCK.png"},
    {name:"IN A PERFECT WORLD",project:"WW3",art:"IAPW.png"},
    {name:"IN A PERFECT WORLD [EARLY]",project:"WW3",art:"IAPWE.png"},
    {name:"WAR",project:"WAR",art:"WAR.jpg"},
    {name:"BAD BITCH PLAYBOOK [PRE VULTURES 1]",project:"BAD BITCH PLAYBOOK",art:"BADBITCHPLAYBOOKPREVULTURES1.png"},
    {name:"BAD BITCH PLAYBOOK",project:"BAD BITCH PLAYBOOK",art:"BADBITCHPLAYBOOK.png"},
    {name:"BAD BITCH PLAYBOOK VOL. 2",project:"BAD BITCH PLAYBOOK",art:"BADBITCHPLAYBOOK2.png"}
  ];
  var active="All";
  var grid=document.getElementById("galleryGrid");
  var count=document.getElementById("galleryCount");
  var filters=document.getElementById("galleryFilters");
  var projects=["All","BULLY","WW3","WAR","BAD BITCH PLAYBOOK"];
  var paletteCache={};
  function escapeHTML(value){return String(value).replace(/[&<>\"']/g,function(ch){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;", "'":"&#039;"})[ch];});}
  function clearTheme(){document.body.classList.remove("is-card-hover");document.body.style.removeProperty("--card-art");document.body.style.removeProperty("--hover-rgb");document.body.style.removeProperty("--hover-secondary-rgb");}
  function applyPalette(item){
    if(paletteCache[item.art]){
      document.body.style.setProperty("--hover-rgb",paletteCache[item.art].primary);
      document.body.style.setProperty("--hover-secondary-rgb",paletteCache[item.art].secondary);
      return;
    }
    var image=new Image();
    image.onload=function(){
      var canvas=document.createElement("canvas");
      canvas.width=24;canvas.height=24;
      var context=canvas.getContext("2d");
      context.drawImage(image,0,0,24,24);
      var pixels=context.getImageData(0,0,24,24).data;
      var primary=[0,0,0,0],secondary=[0,0,0,0];
      for(var index=0;index<pixels.length;index+=16){
        var red=pixels[index],green=pixels[index+1],blue=pixels[index+2];
        var brightness=(red+green+blue)/3;
        if(brightness<18||brightness>245)continue;
        var target=Math.max(red,green,blue)-Math.min(red,green,blue)>22?primary:secondary;
        target[0]+=red;target[1]+=green;target[2]+=blue;target[3]++;
      }
      function rgb(value){var total=value[3]||1;return [Math.round(value[0]/total),Math.round(value[1]/total),Math.round(value[2]/total)].join(",");}
      paletteCache[item.art]={primary:rgb(primary[3]?primary:secondary),secondary:rgb(secondary[3]?secondary:primary)};
      if(document.body.classList.contains("is-card-hover"))applyPalette(item);
    };
    image.src="/assets/"+item.art;
  }
  function applyTheme(item){document.body.style.setProperty("--card-art",'url("/assets/'+item.art.replace(/\"/g,"\\\"")+'")');document.body.classList.add("is-card-hover");applyPalette(item);}
  function renderFilters(){
    filters.innerHTML=projects.map(function(project){return '<button class="gallery-filter'+(project===active?" active":"")+'" type="button" data-filter="'+project+'">'+(project==="All"?"All artwork":project)+"</button>";}).join("");
    filters.querySelectorAll("[data-filter]").forEach(function(button){button.addEventListener("click",function(){active=button.dataset.filter;renderFilters();render();});});
  }
  function render(){
    var visible=items.filter(function(item){return active==="All"||item.project===active;});
    count.textContent=visible.length+" artworks";
    grid.innerHTML=visible.length?visible.map(function(item){return '<article class="gallery-item" tabindex="0" data-art="'+item.art+'" aria-label="'+escapeHTML(item.name)+' artwork"><img class="gallery-art" src="/assets/'+item.art+'" alt="'+escapeHTML(item.name)+' artwork"><div class="gallery-meta"><div class="gallery-name">'+escapeHTML(item.name)+'</div><div class="gallery-kind">'+item.project+'</div></div></article>';}).join(""): '<div class="gallery-empty">No artwork in this project.</div>';
    grid.querySelectorAll(".gallery-item").forEach(function(card){
      var item=items.filter(function(entry){return entry.art===card.dataset.art;})[0];
      card.addEventListener("mouseenter",function(){applyTheme(item);});
      card.addEventListener("mouseleave",clearTheme);
      card.addEventListener("focusin",function(){applyTheme(item);});
      card.addEventListener("focusout",function(event){if(!card.contains(event.relatedTarget))clearTheme();});
    });
  }
  document.addEventListener("click",function(event){if(!event.target.closest(".gallery-item"))clearTheme();});
  document.addEventListener("keydown",function(event){if(event.key==="Escape")clearTheme();});
  renderFilters();render();
})();
</script>
<script src="/theme.js"></script>
<script src="/footer.js"></script>
<script src="/transitions.js"></script>
</body>
</html>
