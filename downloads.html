<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">
<link rel="stylesheet" href="/theme.css">
<title>urYZY [DOWNLOADS]</title>

<style>
.heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
  flex-wrap:wrap;
  padding-bottom:25px;
  border-bottom:1px solid var(--line);
}

.heading-left{
  display:flex;
  align-items:center;
  gap:17px;
}

.heading-logo{
  width:58px;
  height:58px;
  object-fit:contain;
  filter:
    drop-shadow(0 15px 28px rgba(0,0,0,.45))
    drop-shadow(0 0 25px rgba(255,255,255,.04));
}

.heading h1{
  margin:0;
  font-size:45px;
  line-height:1;
  font-weight:700;
  letter-spacing:-2.8px;
}

.count{
  color:var(--dim);
  font-size:11px;
  font-weight:700;
}

/* ---- controls row: search + sort/filter chips ---- */

.controls{
  display:flex;
  gap:10px;
  margin:22px 0 22px;
  flex-wrap:wrap;
}

.search{
  position:relative;
  flex:1 1 260px;
  min-width:0;
}

.search input{
  width:100%;
  height:45px;
  padding:0 15px 0 43px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  outline:none;
  background:var(--surface);
  color:#fff;
  font-family:inherit;
  font-size:12px;
  transition:
    border-color var(--dur-fast) ease,
    background var(--dur-fast) ease,
    box-shadow var(--dur-fast) ease;
}

.search input::placeholder{
  color:#5d626b;
}

.search input:focus{
  border-color:rgba(255,255,255,.16);
  background:#121419;
  box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#666c76;
  font-size:17px;
  pointer-events:none;
}

.filters{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.chip{
  height:45px;
  display:inline-flex;
  align-items:center;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:var(--surface);
  color:var(--muted);
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:
    border-color var(--dur-fast) ease,
    background var(--dur-fast) ease,
    color var(--dur-fast) ease,
    transform var(--dur-fast) ease;
}

.chip:hover{
  color:#fff;
  border-color:rgba(255,255,255,.16);
}

.chip:active{
  transform:scale(.96);
}

.chip.active{
  color:#0a0b0d;
  background:#e7e7e9;
  border-color:#e7e7e9;
}

.archive-additions{
  margin:20px 0 24px;
  padding:10px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:20px;
  background:#101114;
}

.additions-stage{
  position:relative;
  min-height:154px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  background:#08090b;
}

.additions-hero{
  display:grid;
  grid-template-columns:minmax(0,1fr) 112px;
  align-items:center;
  gap:20px;
  min-height:154px;
  padding:14px 56px 14px 62px;
}

.addition-copy{min-width:0;}
.addition-kicker{color:#898e98;font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.addition-feature-title{margin:7px 0 0;color:#fff;font-size:clamp(20px,2.8vw,32px);line-height:.95;}
.addition-feature-copy{max-width:560px;margin:7px 0 0;color:#c3c7ce;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.45;}
.addition-art{width:112px;height:112px;justify-self:end;overflow:hidden;border:1px solid rgba(255,255,255,.35);border-radius:8px;transform:rotate(2deg);}
.addition-art img{display:block;width:100%;height:100%;object-fit:cover;}
.additions-arrow{position:absolute;top:50%;z-index:2;width:34px;height:34px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(0,0,0,.68);color:#fff;font-size:22px;transform:translateY(-50%);cursor:pointer;}
.additions-arrow.previous{left:16px;}.additions-arrow.next{right:16px;}.additions-arrow:disabled{opacity:.3;}
.addition-coming{display:grid;place-items:center;min-height:154px;color:#fff;font-size:22px;font-weight:700;letter-spacing:2px;}
@media(max-width:560px){.additions-hero{display:block;padding:16px 42px;}.additions-stage{min-height:138px;}.additions-hero{min-height:138px;}.addition-art{position:absolute;right:20px;bottom:12px;width:66px;height:66px;opacity:.4;}.addition-copy{max-width:75%;}.addition-feature-title{font-size:24px;}}

/* ---- grid ---- */

.downloads{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.file{
  position:relative;
  display:grid;
  grid-template-columns:72px minmax(0,1fr) auto;
  align-items:center;
  gap:16px;
  min-height:104px;
  padding:15px;
  overflow:hidden;
}

.file.has-preview{
  grid-template-rows:auto auto;
}

.preview-toggle{
  grid-column:2/3;
  grid-row:2;
  justify-self:start;
  margin-top:9px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:none;
  background:none;
  color:var(--dim);
  font-family:inherit;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.3px;
  cursor:pointer;
  padding:0;
  z-index:2;
  transition:color var(--dur-fast) ease;
}

.preview-toggle:hover{
  color:var(--text);
}

.preview-toggle-icon{
  display:inline-block;
  font-size:8px;
  transition:transform var(--dur-base) var(--ease-spring);
}

.preview-toggle.is-open .preview-toggle-icon{
  transform:rotate(180deg);
}

.preview-contents{
  grid-column:1/-1;
  grid-row:3;
  z-index:2;
  max-height:0;
  overflow:hidden;
  transition:max-height var(--dur-base) var(--ease-in-out);
}

.preview-contents.is-open{
  max-height:220px;
}

.preview-contents-inner{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:6px;
}

.preview-row{
  display:flex;
  align-items:center;
  gap:8px;
  color:#8b909a;
  font-size:10.5px;
}

.preview-row-icon{
  flex:0 0 auto;
  color:var(--dimmer);
  font-size:11px;
}

.preview-row-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.preview-row-size{
  flex:0 0 auto;
  color:var(--dimmer);
  font-size:9.5px;
}

.preview-audio{
  width:100%;
  flex:0 0 100%;
  height:30px;
  margin-top:4px;
  accent-color:#fff;
}

.file:after{
  display:none;
}

.icon{
  position:relative;
  z-index:2;
  width:72px;
  height:72px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
  border-radius:11px;
  background:#181a1f;
  color:#565b64;
  font-size:24px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}

.icon-fallback{
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
}

.icon img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.info{
  position:relative;
  z-index:2;
  min-width:0;
}

.name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.25px;
}

.description{
  margin-top:5px;
  overflow:hidden;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  line-clamp:2;
  -webkit-line-clamp:2;
  color:#b5bac2;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  line-height:1.35;
}

.type{
  display:inline-flex;
  margin-top:9px;
  padding:4px 7px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:5px;
  color:#626873;
  font-size:8px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
}

.file-actions{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  gap:6px;
}

.download,
.share{
  height:37px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border-radius:8px;
  font-family:inherit;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
  cursor:pointer;
  border:1px solid transparent;
  transition:
    transform var(--dur-fast) ease,
    background var(--dur-fast) ease,
    border-color var(--dur-fast) ease,
    color var(--dur-fast) ease;
}

.download{
  padding:0 13px;
  border-color:rgba(255,255,255,.75);
  background:#e7e7e9;
  color:#090a0c;
  text-decoration:none;
}

.download:hover{
  transform:translateY(-1px);
  background:#fff;
}

.download:active,
.share:active{
  transform:scale(.96);
}

.share{
  padding:0 12px;
  border-color:rgba(255,255,255,.1);
  background:rgba(255,255,255,.045);
  color:#d7d9dd;
}

.share:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.18);
  color:#fff;
}

.share-icon{
  font-size:13px;
  line-height:1;
}

.share.copied{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.25);
  color:#fff;
}

.empty{
  grid-column:1/-1;
  padding:50px 20px;
  border:1px dashed rgba(255,255,255,.09);
  border-radius:13px;
  text-align:center;
  color:#686e77;
  font-size:11px;
}

/* ---- grouped sections ---- */

.group{
  margin-bottom:30px;
}

.group:last-child{
  margin-bottom:0;
}

.group-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.group-title{
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
}

.group-count{
  color:var(--dimmer);
  font-size:10px;
  font-weight:700;
}

.group-line{
  flex:1;
  height:1px;
  background:var(--line);
}

/* ---- sort select, sits with the filter chips ---- */

.sort-select{
  height:45px;
  padding:0 32px 0 14px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:
    var(--surface)
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0Z' fill='%23858b95'/></svg>")
    no-repeat right 13px center;
  color:var(--muted);
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  transition:border-color var(--dur-fast) ease,color var(--dur-fast) ease;
}

.sort-select:hover{
  color:#fff;
  border-color:rgba(255,255,255,.16);
}

.sort-select:focus-visible{
  outline:2px solid rgba(255,255,255,.55);
  outline-offset:2px;
}

@media(max-width:900px){
  .downloads{
    grid-template-columns:1fr;
  }
}

@media(max-width:560px){
  .heading h1{
    font-size:37px;
    letter-spacing:-2.2px;
  }

  .heading-logo{
    width:47px;
    height:47px;
  }

  .controls{
    flex-direction:column;
  }

  .filters{
    overflow-x:auto;
    padding-bottom:2px;
  }

  .file{
    grid-template-columns:58px minmax(0,1fr) auto;
    gap:12px;
    padding:11px;
  }

  .icon{
    width:58px;
    height:58px;
  }

  .name{
    font-size:13px;
  }

  .description{
    font-size:10px;
  }

  .file-actions{
    gap:5px;
  }

  .download,
  .share{
    width:38px;
    padding:0;
  }

  .download-text,
  .share-text{
    display:none;
  }
}

@media(max-width:390px){
  .file{
    grid-template-columns:52px minmax(0,1fr) auto;
    gap:9px;
  }

  .icon{
    width:52px;
    height:52px;
  }

  .download,
  .share{
    width:35px;
    height:35px;
  }
}

}

@media(max-width:1000px){

    padding:8px;

  }

  .downloads{
    grid-template-columns:1fr;
  }

.archive-spotlight{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:22px;

  pointer-events:none;

.spotlight-copy{
  position:relative;
  z-index:1;

}

.spotlight-kicker{
  color:#858b95;
  font-size:9px;
  font-weight:700;

  text-transform:uppercase;
}

.spotlight-title{
  margin:8px 0 0;

.spotlight-copy p{

  color:#8c9199;

  line-height:1.5;
}

.spotlight-stats{
  display:flex;
  gap:16px;
  margin-top:14px;
}

.spotlight-stat{
  color:#777d86;

  font-weight:700;
  letter-spacing:.8px;

}

.spotlight-stat strong{

}

.spotlight-art-frame{

.spotlight-art-frame img{

}

.additions-carousel{

}

}

.additions-stage:after{
  content:"";

  additionsHeroEl.innerHTML=file?'<div class="addition-copy"><div class="addition-kicker">'+escapeHTML(file.project)+'</div><h2 class="addition-feature-title">'+escapeHTML(file.name)+'</h2><p class="addition-feature-copy">'+escapeHTML(file.description)+'</p></div><div class="addition-art"><img src="/assets/'+escapeHTML(file.icon)+'" alt="'+escapeHTML(file.name)+' artwork"></div>':'<div class="addition-coming">MORE COMING SOON!</div>';

var toastTimer;
var zipCache={}; // id -> array of {name,size} once read

function escapeHTML(value){
  return String(value==null?"":value).replace(/[&<>"']/g,function(ch){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[ch];
  });
}

function formatBytes(bytes){
  if(!bytes&&bytes!==0)return "";
  if(bytes<1024)return bytes+" B";
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+" KB";
  return (bytes/(1024*1024)).toFixed(1)+" MB";
}

function iconFor(name){
  if(/\.(mp3|wav|m4a|flac|aac)$/i.test(name))return "♪";
  if(/\.(jpg|jpeg|png|gif|webp)$/i.test(name))return "▨";
  if(/\.(txt|md|nfo)$/i.test(name))return "▤";
  return "▫";
}

function getDownloadURL(file){
  return new URL(file.file,window.location.origin).href;
}

function showToast(message){
  clearTimeout(toastTimer);
  toastEl.textContent=message;
  toastEl.classList.add("show");
  toastTimer=setTimeout(function(){toastEl.classList.remove("show");},2200);
}

function shareFile(file,button){
  var url=getDownloadURL(file);
  var shareData={title:file.name+" — urYZY",text:"Download "+file.name+" from urYZY.",url:url};

  function fallbackCopy(){
    navigator.clipboard.writeText(url).then(function(){
      button.classList.add("copied");
      button.querySelector(".share-text").textContent="Copied";
      showToast("Download link copied.");
      setTimeout(function(){
        button.classList.remove("copied");
        button.querySelector(".share-text").textContent="Share";
      },1800);
    }).catch(function(){showToast("Unable to share this download.");});
  }

  if(navigator.share){
    navigator.share(shareData).then(function(){showToast("Shared successfully.");}).catch(function(error){
      if(error&&error.name==="AbortError")return;
      fallbackCopy();
    });
  }else{
    fallbackCopy();
  }
}

/* ---- real zip reading, on demand ---- */

function readZipEntries(file){
  if(zipCache[file.id]){
    return Promise.resolve(zipCache[file.id]);
  }

  return fetch(getDownloadURL(file))
    .then(function(res){
      if(!res.ok)throw new Error("fetch failed: "+res.status);
      return res.blob();
    })
    .then(function(blob){
      return JSZip.loadAsync(blob);
    })
    .then(function(zip){
      var entries=[];
      var audioEntries=[];
      zip.forEach(function(relPath,entry){
        if(entry.dir)return;
        var item={
          name:relPath,
          size:(entry._data&&entry._data.uncompressedSize)||entry.uncompressedSize||0,
          isAudio:/\.(mp3|wav|m4a|aac|ogg)$/i.test(relPath),
          zipEntry:entry
        };
        entries.push(item);
        if(item.isAudio)audioEntries.push(item);
      });
      entries.sort(function(a,b){return a.name.localeCompare(b.name);});
      return Promise.all(audioEntries.map(function(item){
        return item.zipEntry.async("blob").then(function(blob){
          item.url=URL.createObjectURL(blob);
          delete item.zipEntry;
        });
      })).then(function(){
        entries.forEach(function(item){delete item.zipEntry;});
        zipCache[file.id]=entries;
        return entries;
      });
    });
}

function contentsRowsHTML(entries){
  if(!entries.length){
    return '<div class="preview-row"><span class="preview-row-name">Empty archive.</span></div>';
  }
  return entries.map(function(item){
    return ''+
      '<div class="preview-row">'+
        '<span class="preview-row-icon">'+iconFor(item.name)+'</span>'+
        '<span class="preview-row-name">'+escapeHTML(item.name)+'</span>'+
        '<span class="preview-row-size">'+escapeHTML(formatBytes(item.size))+'</span>'+ 
        (item.url?'<audio class="preview-audio" controls preload="none" src="'+escapeHTML(item.url)+'"></audio>':'')+
      '</div>';
  }).join("");
}

function togglePreview(file,button){
  var panel=document.getElementById("preview-"+file.id);
  if(!panel)return;

  var willOpen=!panel.classList.contains("is-open");

  if(!willOpen){
    panel.classList.remove("is-open");
    button.classList.remove("is-open");
    button.querySelector("span").textContent="Preview contents";
    return;
  }

  // opening: show it immediately with a loading state, then fill in
  // real contents once the zip has actually been fetched and read
  panel.classList.add("is-open");
  button.classList.add("is-open");

  if(zipCache[file.id]){
    panel.querySelector(".preview-contents-inner").innerHTML=contentsRowsHTML(zipCache[file.id]);
    button.querySelector("span").textContent="Hide contents";
    return;
  }

  panel.querySelector(".preview-contents-inner").innerHTML=
    '<div class="preview-row preview-loading"><span class="preview-row-name">Reading archive…</span></div>';
  button.querySelector("span").textContent="Loading…";
  button.disabled=true;

  readZipEntries(file).then(function(entries){
    panel.querySelector(".preview-contents-inner").innerHTML=contentsRowsHTML(entries);
    button.querySelector("span").textContent="Hide contents";
    button.disabled=false;
  }).catch(function(err){
    panel.querySelector(".preview-contents-inner").innerHTML=
      '<div class="preview-row"><span class="preview-row-name">Couldn\'t read this archive.</span></div>';
    button.querySelector("span").textContent="Preview contents";
    button.disabled=false;
    panel.classList.remove("is-open");
    button.classList.remove("is-open");
    console.error("zip preview failed for",file.id,err);
  });
}

/* ---- rendering ---- */

function fileCardHTML(file){
  return ''+
    '<article class="file surface-card has-preview" data-art="'+escapeHTML(file.icon)+'" tabindex="0" aria-label="'+escapeHTML(file.name)+' download card">'+
      '<div class="icon">'+
        '<img src="/assets/'+escapeHTML(file.icon)+'" alt="" '+
          'onerror="this.outerHTML=\'<span class=&quot;icon-fallback&quot;>&#9635;</span>\'">'+
      '</div>'+
      '<div class="info">'+
        '<div class="name">'+escapeHTML(file.name)+'</div>'+
        '<div class="description">'+escapeHTML(file.description)+'</div>'+
        '<div class="type">ZIP Archive</div>'+
      '</div>'+
      '<div class="file-actions">'+
        '<a class="download" href="'+escapeHTML(file.file)+'" download title="Download '+escapeHTML(file.name)+'">'+
          '<span>↓</span><span class="download-text">Download</span>'+
        '</a>'+
        '<button class="share" type="button" data-share-id="'+escapeHTML(file.id)+'" title="Share '+escapeHTML(file.name)+'">'+
          '<span class="share-icon">↗</span><span class="share-text">Share</span>'+
        '</button>'+
      '</div>'+
      '<button class="preview-toggle" type="button" data-preview-id="'+escapeHTML(file.id)+'">'+
        '<span>Preview contents</span><span class="preview-toggle-icon">⌄</span>'+
      '</button>'+
      '<div class="preview-contents" id="preview-'+escapeHTML(file.id)+'">'+
        '<div class="preview-contents-inner"></div>'+
      '</div>'+
    '</article>';
}

function sortFiles(list){
  var copy=list.slice();
  if(activeSort==="az"){
    copy.sort(function(a,b){return a.name.localeCompare(b.name);});
  }
  return copy;
}

function renderFilters(){
  filtersEl.innerHTML=projects.map(function(project){
    return '<button class="chip'+(project===activeProject?" active":"")+
      '" type="button" data-project="'+escapeHTML(project)+'">'+
      escapeHTML(project==="All"?"All Projects":project)+
      "</button>";
  }).join("");

  filtersEl.querySelectorAll("[data-project]").forEach(function(btn){
    btn.addEventListener("click",function(){
      activeProject=btn.dataset.project;
      renderFilters();
      renderFiles(searchEl.value);
    });
  });
}

function renderFiles(filter){
  var value=(filter||"").toLowerCase().trim();

  var filtered=files.filter(function(file){
    var matchesSearch=
      file.name.toLowerCase().indexOf(value)!==-1||
      file.description.toLowerCase().indexOf(value)!==-1;
    var matchesProject=activeProject==="All"||file.project===activeProject;
    return matchesSearch&&matchesProject;
  });

  fileCountEl.textContent=filtered.length+" "+(filtered.length===1?"file":"files");

  if(!filtered.length){
    downloadsEl.innerHTML='<div class="empty">No downloads found.</div>';
    return;
  }

  var groups=projects.filter(function(p){return p!=="All";}).map(function(p){
    return {name:p,items:filtered.filter(function(f){return f.project===p;})};
  }).filter(function(g){return g.items.length;});

  downloadsEl.innerHTML=groups.map(function(group){
    var items=sortFiles(group.items);
    if(activeSort==="newest"){items=items.slice().reverse();}
    return ''+
      '<div class="group">'+
        '<div class="group-head">'+
          '<div class="group-title">'+escapeHTML(group.name)+'</div>'+
          '<div class="group-count">'+items.length+'</div>'+
          '<div class="group-line"></div>'+
        '</div>'+
        '<div class="downloads">'+items.map(fileCardHTML).join("")+'</div>'+
      '</div>';
  }).join("");

  downloadsEl.querySelectorAll("[data-share-id]").forEach(function(button){
    button.addEventListener("click",function(){
      var file=files.filter(function(item){return item.id===button.dataset.shareId;})[0];
      if(file)shareFile(file,button);
    });
  });

  downloadsEl.querySelectorAll("[data-preview-id]").forEach(function(button){
    button.addEventListener("click",function(){
      var file=files.filter(function(item){return item.id===button.dataset.previewId;})[0];
      if(file)togglePreview(file,button);
    });
  });

  downloadsEl.querySelectorAll(".file[data-art]").forEach(function(card){
    var paletteCache={};

    function setPalette(imageName){
      if(paletteCache[imageName]){
        document.body.style.setProperty("--hover-rgb",paletteCache[imageName].primary);
        document.body.style.setProperty("--hover-secondary-rgb",paletteCache[imageName].secondary);
        return;
      }

      var image=new Image();
      image.onload=function(){
        var canvas=document.createElement("canvas");
        canvas.width=24;
        canvas.height=24;
        var context=canvas.getContext("2d");
        context.drawImage(image,0,0,24,24);
        var pixels=context.getImageData(0,0,24,24).data;
        var primary=[0,0,0,0];
        var secondary=[0,0,0,0];

        for(var index=0;index<pixels.length;index+=16){
          var red=pixels[index];
          var green=pixels[index+1];
          var blue=pixels[index+2];
          var brightness=(red+green+blue)/3;
          if(brightness<18||brightness>245)continue;
          var saturation=Math.max(red,green,blue)-Math.min(red,green,blue);
          var target=saturation>22?primary:secondary;
          target[0]+=red;
          target[1]+=green;
          target[2]+=blue;
          target[3]++;
        }

        function rgb(value){
          var total=value[3]||1;
          return [Math.round(value[0]/total),Math.round(value[1]/total),Math.round(value[2]/total)].join(",");
        }

        var palette={primary:rgb(primary[3]?primary:secondary),secondary:rgb(secondary[3]?secondary:primary)};
        paletteCache[imageName]=palette;
        if(document.body.classList.contains("is-card-hover")){
          document.body.style.setProperty("--hover-rgb",palette.primary);
          document.body.style.setProperty("--hover-secondary-rgb",palette.secondary);
        }
      };
      image.src="/assets/"+imageName;
    }

    function showCardTheme(){
      document.body.style.setProperty("--card-art",'url("/assets/'+card.dataset.art.replace(/"/g,"\\\"")+'")');
      setPalette(card.dataset.art);
      document.body.classList.add("is-card-hover");
      card.classList.add("is-art-active");
    }

    function clearCardTheme(){
      document.body.classList.remove("is-card-hover");
      document.body.style.removeProperty("--card-art");
      document.body.style.removeProperty("--hover-rgb");
      document.body.style.removeProperty("--hover-secondary-rgb");
      card.classList.remove("is-art-active");
    }

    card.addEventListener("mouseenter",showCardTheme);
    card.addEventListener("mouseleave",clearCardTheme);
    card.addEventListener("focusin",showCardTheme);
    card.addEventListener("focusout",function(event){
      if(!card.contains(event.relatedTarget))clearCardTheme();
    });
    card.addEventListener("click",function(event){
      if(!event.target.closest(".file"))clearCardTheme();
    });
  });
}

searchEl.addEventListener("input",function(){renderFiles(searchEl.value);});
sortEl.addEventListener("change",function(){activeSort=sortEl.value;renderFiles(searchEl.value);});

function clearPageTheme(){
  document.body.classList.remove("is-card-hover");
  document.body.style.removeProperty("--card-art");
  document.body.style.removeProperty("--hover-rgb");
  document.body.style.removeProperty("--hover-secondary-rgb");
  downloadsEl.querySelectorAll(".file.is-art-active").forEach(function(card){card.classList.remove("is-art-active");});
}

clearPageTheme();
window.addEventListener("scroll",clearPageTheme,{passive:true});

document.addEventListener("click",function(event){
  if(!event.target.closest(".file")){
    clearPageTheme();
  }
});

document.addEventListener("keydown",function(event){
  if(event.key==="Escape"){
    clearPageTheme();
  }
});

renderFilters();
renderFiles();
})();
</script>

<script src="/footer.js"></script>
<script src="/transitions.js"></script>
<script src="/ambient-background.js"></script>
</body>
