html, body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

.nav {
  display: none;
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  align-items: center;
  gap: 22px;
  background: transparent;
  border: 0;
  padding: 0;
}

.nav a {
  color: #fff !important;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: .26em;
  font-size: 10px;
  font-weight: 700;
  opacity: .78;
}

.nav a.active,
.nav a:hover {
  opacity: 1;
}

.container {
  width: 100%;
  margin: 0;
  padding: 0;
}

.heading {
  display: none;
  position: fixed;
  left: 28px;
  bottom: 25px;
  z-index: 10;
  padding: 0;

}

.heading-left {

}

.heading-logo {

}

.heading h1 {
  margin: 0 0 7px;
  font-size: 11px;
  line-height: 1;
  letter-spacing: .28em;
  text-transform: uppercase;
  font-weight: 700;
  color: #fff;
}

.count {
  color: #777;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  opacity: .7;
}

#downloadsList {
  display: block;
  margin: 0;
}

.release-card {
  position: relative;
  display: block;
  min-height: 100vh;
  overflow: hidden;
  background: #000;
  color: #fff;
}

.release-card::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 24%;
  background: linear-gradient(transparent, rgba(0,0,0,.5));
  pointer-events: none;
}

.release-visual {
  position: absolute;
  inset: 0;
  display: block;
  overflow: hidden;
}

.vinyl {
  position: absolute;
  top: 50%;
  right: 18%;
  width: min(48vw, 420px);
  height: min(48vw, 420px);
  border-radius: 50%;
  transform: translateY(-50%);
  clip-path: inset(0 0 0 50% round 0 50% 50% 0);
  background:
    radial-gradient(circle at 42% 36%, rgba(255,255,255,.2), transparent 16%),
    repeating-radial-gradient(circle at 46% 48%, #181818 0 2px, #303030 2px 3px, #0b0b0b 3px 7px);
  box-shadow:
    inset 25px 0 34px rgba(255,255,255,.12),
    inset -44px -15px 52px rgba(0,0,0,.78),
    0 0 40px rgba(255,255,255,.06);
}

.vinyl::before {
  content: "";
  position: absolute;
  inset: 13%;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: 0 0 0 2px rgba(0,0,0,.7), 0 0 0 3px rgba(255,255,255,.04);
}

.vinyl::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(90deg, rgba(0,0,0,.22), transparent 18%, rgba(0,0,0,.2) 65%, #000 92%);
}

.vinyl.back {
  right: 18%;
  transform: translate(-4%, -50%);
  opacity: .72;
}

.vinyl.front {
  right: 18%;
  z-index: 2;
}

.release-cover {
  display: none;
}

.release-meta {
  position: absolute;
  left: 28px;
  bottom: 25px;
  z-index: 3;
  display: block;
  opacity: 0;
  transition: opacity .25s ease;
}

.release-card:hover .release-meta,
.release-card:focus-visible .release-meta {
  opacity: 1;
}

.release-title {
  margin: 0;
  font-size: 12px;
  line-height: 1;
  letter-spacing: .28em;
  text-transform: uppercase;
  font-weight: 700;
  color: #fff;
}

.release-copy {
  margin: 7px 0 0;
  font-size: 9px;
  line-height: 1;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #666;
}

/* The template exposes one object at a time; the next record is reached by scrolling. */
.release-card + .release-card {
  border-top: 1px solid #111;
}

/* Keep the anchor area quiet while preserving keyboard and download access. */
.release-card:focus-visible {
  outline: 1px solid #fff;
  outline-offset: -8px;
}

/* Legacy card rules are intentionally overridden above. */
.release-card {
  text-decoration: none;
}

@media (max-width: 900px) {
  .vinyl {
    right: 10%;
    width: min(58vw, 390px);
    height: min(58vw, 390px);
  }

  .vinyl.back {
    right: 10%;
  }
}

@media (max-width: 560px) {

  }

  .vinyl {

    width: 64vw;
    height: 64vw;
  }

  .vinyl.back {
    right: 7%;
  }
}
</style>

        });
        if (!audioEntries.length) throw new Error("No audio preview found");
        return Promise.all(audioEntries.map(function(entry) {
          return entry.async("blob").then(function(blob) { return URL.createObjectURL(blob); });
        }));
      })
      .then(function(urls) {
        audioCache[file.id] = urls;
        return urls[Math.floor(Math.random() * urls.length)];
      });
  }

  function playPreview(file, visual) {
    var request;
    stopPreview().then(function() {
      request = ++previewRequest;
      return loadPreviewAudio(file);
    }).then(function(url) {
      if (request !== previewRequest || !visual.matches(":hover") || document.hidden) return;
      var audio = new Audio(url);
      audio.volume = .58;
      audio.muted = true;
      previewAudios.push(audio);
      activeAudio = audio;
      activeVisual = visual;
      visual.classList.add("is-playing");
      return audio.play().then(function() {
        audio.muted = false;
      });
    }).catch(function() {
      visual.classList.remove("is-playing");
    });
  }

  document.addEventListener("visibilitychange", function() {
    if (document.hidden) stopPreviewImmediately();
  });
  window.addEventListener("blur", stopPreviewImmediately);
  window.addEventListener("pagehide", stopPreviewImmediately);
  window.addEventListener("beforeunload", stopPreviewImmediately);
  document.addEventListener("click", function(event) {
    var link = event.target.closest("a");
    if (link && !link.closest(".release-card")) stopPreviewImmediately();
  }, true);

  function renderDownloads() {
    var sections = [
      { title: "BULLY", match: function(file) { return file.name.indexOf("BULLY") === 0; } },
      { title: "CUCK", match: function(file) { return file.name === "CUCK" || file.name.indexOf("IN A PERFECT WORLD") === 0 || file.name === "WW3"; } },
      { title: "WAR", match: function(file) { return file.name === "WAR"; } },
      { title: "VULTURES / BAD BITCH PLAYBOOK", match: function(file) { return file.name.indexOf("BAD BITCH PLAYBOOK") === 0; } },
      { title: "GRADUATE", match: function(file) { return file.id === "GRADUATE"; } },
      { title: "CRUEL", match: function(file) { return file.family === "CRUEL"; } },
      { title: "PABLO", match: function(file) { return file.id === "PABLO"; } }
    ];

    var sectionHTML = sections.map(function(section) {
      var sectionFiles = files.filter(section.match);
      var cards = sectionFiles.map(function(file) {
      var title = file.name;
      var cover = "/assets/" + file.icon;
      var description = descriptions[file.name] || "Unreleased material from the archive.";

      return '<a class="release-card" href="' + escapeHTML(file.file) + '" download aria-label="' + escapeHTML(file.name) + '">' +
        '<div class="release-visual">' +
          '<span class="vinyl back"></span>' +
          '<span class="vinyl front"></span>' +
          '<div class="release-cover"><img src="' + cover + '" alt="' + escapeHTML(file.name) + '"></div>' +
        '</div>' +
        '<div class="release-meta">' +
          '<div>' +
            '<h2 class="release-title">' + escapeHTML(title) + '</h2>' +
            '<p class="release-description-text">' + escapeHTML(description) + '</p>' +
          '</div>' +
        '</div>' +
      '</a>';
      }).join("");

      return '<section class="download-section" aria-labelledby="section-' + escapeHTML(section.title) + '">' +
        '<header class="download-section-heading">' +
          '<h2 class="download-section-title" id="section-' + escapeHTML(section.title) + '">' + escapeHTML(section.title) + '</h2>' +
          '<span class="download-section-count">' + sectionFiles.length + ' releases</span>' +
        '</header>' +
        '<div class="download-section-grid">' + cards + '</div>' +
      '</section>';
    }).join("");

    downloadsEl.innerHTML = sectionHTML;
    fileCountEl.textContent = files.length + " files";

    Array.prototype.forEach.call(downloadsEl.querySelectorAll(".release-card"), function(card, index) {
      var file = files.filter(function(item) { return item.file === card.getAttribute("href"); })[0];
      if (!file) return;
      var visual = card.querySelector(".release-visual");
      var tapTimer = null;
      visual.addEventListener("mouseenter", function() { playPreview(file, visual); });
      visual.addEventListener("mouseleave", function() { stopPreview(visual); });
      visual.addEventListener("touchstart", function(event) {
        event.preventDefault();

        if (card.dataset.tapArmed === "true") {
          window.location.href = card.href;
          return;
        }

        card.dataset.tapArmed = "true";
        clearTimeout(tapTimer);
        playPreview(file, visual);
        tapTimer = setTimeout(function() {
          stopPreview(visual);
          card.dataset.tapArmed = "false";
        }, 1600);
      }, { passive: false });
      visual.addEventListener("touchcancel", function() {
        clearTimeout(tapTimer);
        stopPreview(visual);
        card.dataset.tapArmed = "false";
      }, { passive: true });
    });
  }

  renderDownloads();
})();
</script>

<script src="/theme.js"></script>
<script src="/footer.js"></script>
<script src="/transitions.js"></script>
</body>
