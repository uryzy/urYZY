<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">
<title>urYZY [UPDATING]</title>
<style>
@font-face{font-family:Yeezy;src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:Yeezy;src:url("/fonts/yeezy_tstar-bold-webfont.woff") format("woff");font-weight:700;font-display:swap}
*{box-sizing:border-box}
:root{color-scheme:dark;background:#08090b;color:#f5f5f6}
html,body{min-height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;padding:28px;background:radial-gradient(circle at 50% 0,rgba(255,255,255,.09),transparent 34rem),#08090b;color:#f5f5f6;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 82%);-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 82%)}
.panel{position:relative;width:min(540px,100%);padding:42px 34px 38px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012));box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);text-align:center}
.mark{width:96px;height:96px;margin:0 auto 25px;object-fit:contain;filter:drop-shadow(0 20px 35px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite}
.eyebrow{color:#858b95;font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase}
h1{margin:13px 0 0;font-size:clamp(44px,10vw,72px);line-height:.86;letter-spacing:-4px}
.copy{max-width:360px;margin:20px auto 0;color:#858b95;font-size:13px;line-height:1.65}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:25px;padding:9px 12px;border:1px solid rgba(255,255,255,.1);border-radius:999px;color:#d8d9dc;font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase}
.dot{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.8);animation:pulse 1.7s ease-in-out infinite}
.note{margin:22px 0 0;color:#5e646e;font-size:10px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.mark,.dot{animation:none}}
@media(max-width:480px){body{padding:18px}.panel{padding:34px 22px 30px}.mark{width:78px;height:78px;margin-bottom:21px}h1{letter-spacing:-3px}.copy{font-size:12px}}
</style>
</head>
<body>
<main class="panel" aria-labelledby="page-title">
  <img class="mark" src="/assets/LOGO2.png" alt="urYZY">
  <div class="eyebrow">urYZY archive</div>
  <h1 id="page-title">Updating.</h1>
  <p class="copy">The archive is temporarily paused while we make improvements. Everything will be back shortly.</p>
  <div class="status"><span class="dot" aria-hidden="true"></span>Maintenance in progress</div>
  <p class="note">Please check back soon.</p>
</main>
</body>
</html>
