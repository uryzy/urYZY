<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">
<title>urYZY - Updates</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --text: #f5f5f5;
  --text-secondary: #999;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.15);
  --ease: 0.25s cubic-bezier(0.22,1,0.36,1);
}

html { scroll-behavior: smooth; }

body {
  background: linear-gradient(135deg, #0a0a0a 0%, #151515 100%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.6;
  padding-top: 60px;
  min-height: 100vh;
}

/* Navigation */
nav {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 999;
  display: flex;
  gap: 0;
  padding: 16px 4px;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  width: 100%;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

nav a {
  text-decoration: none;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.3px;
  position: relative;
  transition: all var(--ease);
  padding: 8px 24px;
  border-radius: 10px;
  text-transform: capitalize;
}

nav a:hover { color: var(--text); background: rgba(255,255,255,0.05); }
nav a.active { color: var(--text); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }

/* Main */
main {
  max-width: 800px;
  margin: 0 auto;
  padding: 40px 20px 80px;
  animation: fadeIn var(--ease);
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Section Head */
.section-head { margin-bottom: 50px; }
.section-head h1 { font-size: clamp(40px, 8vw, 56px); font-weight: 700; letter-spacing: -0.6px; margin-bottom: 10px; }
.section-head p { color: var(--text-secondary); font-size: 15px; }

/* Updates List */
.updates-list { margin-top: 40px; }

.update-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 18px;
  transition: all var(--ease);
}

.update-card:hover {
  background: rgba(255,255,255,0.05);
  border-color: var(--border-hover);
  transform: translateY(-2px);
}

.update-date {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
  opacity: 0.8;
}

.update-card h3 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 10px;
  letter-spacing: -0.2px;
}

.update-card p {
  font-size: 14px;
  color: var(--text-secondary);
  margin: 0;
  line-height: 1.7;
}

/* Footer */
footer {
  border-top: 1px solid var(--border);
  padding: 40px 20px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 12px;
  margin-top: 40px;
}

/* Responsive */
@media (max-width: 768px) {
  body { padding-top: 55px; }
  nav { padding: 12px 8px; }
  nav a { padding: 6px 16px; font-size: 12px; }
  main { padding: 30px 16px 60px; }
  .update-card { padding: 18px; }
  .update-card h3 { font-size: 16px; }
}
</style>
</head>

<body>

<nav>
  <a href="/" id="nav-home">Home</a>
  <a href="/downloads" id="nav-downloads">Downloads</a>
  <a href="/updates" class="active" id="nav-updates">Updates</a>
</nav>

<main class="u-view">
  <div class="section-head">
    <h1>Updates</h1>
    <p>Latest news and announcements</p>
  </div>

  <div class="updates-list" id="updatesList"></div>
</main>

<footer id="footer"></footer>

<script>
(function() {
  const updates = [
    {
      date: 'September 5, 2026',
      title: 'Complete Design Overhaul',
      description: 'Completely redesigned the site with a refined, human-made aesthetic. Added top-center navigation, real album artwork, and dynamic theme switching that responds to scroll position. The new design is much cleaner and faster.'
    },
    {
      date: 'September 1, 2026',
      title: 'Performance Optimization',
      description: 'Removed all complex animations and heavy effects. The site now loads instantly and scrolls smoothly with zero lag. All pages are optimized for fast performance.'
    },
    {
      date: 'August 28, 2026',
      title: 'Visual Refinement',
      description: 'Redesigned album cards with better spacing and rounded corners. Improved typography, color contrast, and overall visual hierarchy throughout the site.'
    },
    {
      date: 'August 20, 2026',
      title: 'Album Artwork Integration',
      description: 'Added high-quality album artwork for all available projects. Each album now displays its cover art prominently in the downloads section.'
    },
  ];

  const updatesList = document.getElementById('updatesList');
  updatesList.innerHTML = updates.map(update => `
    <div class="update-card">
      <div class="update-date">${update.date}</div>
      <h3>${update.title}</h3>
      <p>${update.description}</p>
    </div>
  `).join('');

  const year = new Date().getFullYear();
  document.getElementById('footer').innerHTML = `
    <p>&copy; ${year} urYZY. An independent, fan-run archive. Not affiliated with or endorsed by any label or artist.</p>
  `;
})();
</script>

<script src="/ambient-background.js"></script>
</body>
</html>
