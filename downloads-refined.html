<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">
<title>urYZY - Downloads</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --text: #f5f5f5;
  --text-secondary: #999;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.15);
  --ease: 0.25s cubic-bezier(0.22,1,0.36,1);
}

html { scroll-behavior: smooth; }

body {
  background: linear-gradient(135deg, #0a0a0a 0%, #151515 100%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.6;
  padding-top: 60px;
  min-height: 100vh;
}

/* Navigation - Top Center */
nav {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 999;
  display: flex;
  gap: 0;
  padding: 16px 4px;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  width: 100%;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

nav a {
  text-decoration: none;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.3px;
  position: relative;
  transition: all var(--ease);
  padding: 8px 24px;
  border-radius: 10px;
  text-transform: capitalize;
}

nav a:hover { color: var(--text); background: rgba(255,255,255,0.05); }
nav a.active { color: var(--text); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }

/* Main Container */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px 80px;
  animation: fadeIn var(--ease);
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Section Head */
.section-head { margin-bottom: 50px; }
.section-head h1 { font-size: clamp(40px, 8vw, 56px); font-weight: 700; letter-spacing: -0.6px; margin-bottom: 10px; }
.section-head p { color: var(--text-secondary); font-size: 15px; }

/* Album Grid */
.albums-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 24px;
  margin-top: 40px;
  margin-bottom: 60px;
}

.album-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: all var(--ease);
  scroll-margin-top: 100px;
}

.album-card:hover {
  background: rgba(255,255,255,0.05);
  border-color: var(--border-hover);
  transform: translateY(-6px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.3);
}

.album-cover {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: rgba(255,255,255,0.03);
}

.album-info { padding: 14px; }

.album-name { 
  font-size: 15px; 
  font-weight: 600; 
  letter-spacing: -0.2px; 
  margin-bottom: 4px;
  line-height: 1.3;
}

.album-meta { 
  font-size: 12px; 
  color: var(--text-secondary);
  display: flex;
  gap: 8px;
}

/* Theme Display */
.theme-indicator {
  position: fixed;
  bottom: 30px;
  right: 30px;
  padding: 16px 20px;
  background: rgba(10,10,10,0.9);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 12px;
  color: var(--text-secondary);
  backdrop-filter: blur(10px);
  z-index: 100;
  min-width: 160px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.theme-name { 
  font-weight: 600; 
  color: var(--text); 
  margin-top: 6px; 
  font-size: 13px;
}

/* Footer */
footer {
  border-top: 1px solid var(--border);
  padding: 40px 20px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 12px;
  margin-top: 40px;
}

/* Responsive */
@media (max-width: 768px) {
  body { padding-top: 55px; }
  nav { padding: 12px 8px; }
  nav a { padding: 6px 16px; font-size: 12px; }
  main { padding: 30px 16px 60px; }
  .albums-grid { gap: 16px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .theme-indicator { bottom: 20px; right: 20px; font-size: 11px; }
}

/* Theme Backgrounds */
body.theme-bully { background: linear-gradient(135deg, #2a1a1a 0%, #0a0a0a 100%); }
body.theme-ww3 { background: linear-gradient(135deg, #1a2a1a 0%, #0a0a0a 100%); }
body.theme-cuck { background: linear-gradient(135deg, #2a1a2a 0%, #0a0a0a 100%); }
body.theme-iapw { background: linear-gradient(135deg, #2a2a1a 0%, #0a0a0a 100%); }
</style>
</head>

<body>

<nav>
  <a href="/" id="nav-home">Home</a>
  <a href="/downloads" class="active" id="nav-downloads">Downloads</a>
  <a href="/updates" id="nav-updates">Updates</a>
</nav>

<main class="u-view">
  <div class="section-head">
    <h1>Downloads</h1>
    <p>Scroll through albums to see the theme change in real-time</p>
  </div>

  <div class="albums-grid" id="albumsGrid"></div>
</main>

<div class="theme-indicator" id="themeIndicator">
  <div style="font-size: 11px; opacity: 0.8;">Now Playing</div>
  <div class="theme-name" id="themeName">urYZY</div>
</div>

<footer id="footer"></footer>

<script>
(function() {
  const albums = [
    { id: 'bully', name: 'BULLY', image: '/assets/BULLYLP.png', theme: 'bully' },
    { id: 'bully-dg', name: 'BULLY [DG]', image: '/assets/BULLYDG.png', theme: 'bully' },
    { id: 'bully-pv', name: 'BULLY [PV]', image: '/assets/BULLYPV.png', theme: 'bully' },
    { id: 'bully-early', name: 'BULLY [EARLY]', image: '/assets/BULLYEARLY.png', theme: 'bully' },
    { id: 'ww3', name: 'WW3', image: '/assets/WW3.png', theme: 'ww3' },
    { id: 'cuck', name: 'CUCK', image: '/assets/CUCK.png', theme: 'cuck' },
    { id: 'iapw', name: 'IN A PERFECT WORLD', image: '/assets/IAPW.png', theme: 'iapw' },
    { id: 'iapw-early', name: 'IAPW [EARLY]', image: '/assets/IAPWE.png', theme: 'iapw' },
  ];

  const grid = document.getElementById('albumsGrid');
  const themeIndicator = document.getElementById('themeIndicator');
  const themeName = document.getElementById('themeName');

  // Render albums
  grid.innerHTML = albums.map(album => `
    <div class="album-card" data-album-id="${album.id}" data-theme="${album.theme}">
      <img class="album-cover" src="${album.image}" alt="${album.name}" loading="lazy" />
      <div class="album-info">
        <div class="album-name">${album.name}</div>
        <div class="album-meta"><span>Album</span></div>
      </div>
    </div>
  `).join('');

  // Intersection Observer for theme changes
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const theme = entry.target.dataset.theme;
        const albumId = entry.target.dataset.albumId;
        const album = albums.find(a => a.id === albumId);
        
        document.body.className = theme ? `theme-${theme}` : '';
        themeName.textContent = album ? album.name : 'urYZY';
      }
    });
  }, { threshold: 0.6 });

  document.querySelectorAll('.album-card').forEach(card => observer.observe(card));

  // Footer
  const year = new Date().getFullYear();
  document.getElementById('footer').innerHTML = `
    <p>&copy; ${year} urYZY. An independent, fan-run archive. Not affiliated with or endorsed by any label or artist.</p>
  `;
})();
</script>

<script src="/ambient-background.js"></script>
</body>
</html>
